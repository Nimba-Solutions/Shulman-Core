minimum_cumulusci_version: "3.78.0"
project:
  name: Shulman-Core
  package:
    name: Shulman-Core
    api_version: "64.0"
  git:
    default_branch: "main"
    prefix_feature: "feature/"
    prefix_beta: "beta/"
    prefix_release: "release/"
  source_format: sfdx
  dependencies:
    - namespace: litify_pm
      version: "35.0"
    - package_name: Custom Lightning Text Banners
      version_id: "04t4T0000011RGTQA2"
    - package_name: GetPicklistValuesBulkified Version 1.5.0.0
      version_id: "04t5G0000043xs7QAA"
    - package_name: directNavigation Version 1.0.0.0
      version_id: "04t5G000004PuWpQAK"
    - package_name: customHeader Version 1.0.0.0
      version_id: "04t5G000004PucoQAC"
    - package_name: ShowToastFA Version 1.2.0.1
      version_id: "04tB0000000N6GxIAK"
    - package_name: FlowActionsBasePack Version 3.15.0.0
      version_id: "04t8b000001BTgsAAG"
    - package_name: FlowScreenComponentsBasePack Version 3.3.2.0
      version_id: "04t5G000004XZjLQAW"
    - package_name: multishimFSC Version 1.0.0.1
      version_id: "04tB0000000N4tiIAC"
    - github: https://github.com/nimba-solutions/docs-unlocked
    - github: https://github.com/nimba-solutions/json-unlocked
tasks:
  robot:
    options:
      suites: robot/Shulman-Core/tests
      options:
        outputdir: robot/Shulman-Core/results

  robot_testdoc:
    options:
      path: robot/Shulman-Core/tests
      output: robot/Shulman-Core/doc/Shulman-Core_tests.html

  run_tests:
    options:
      test_suite_names: ShulmanCore
      required_org_code_coverage_percent: 75

flows:
  build_unlocked_test_package:
    steps:
      1:
        task: update_package_xml
        when: project_config.project__source_format != "sfdx"
        options:
          path: src
      1.5:
        task: update_dependencies
        options:
          dependencies:
            - namespace: litify_pm
              version: "35.0"
          packages_only: True
      2:
        task: create_package_version
        options:
          package_type: Unlocked
          package_name: $project_config.project__package__name Unlocked Feature Test
          version_type: minor
          resolution_strategy: unlocked
          org_dependent: True
          force_upload: True
          post_install_script: None
          uninstall_script: None
      3:
        task: promote_package_version
        options:
          version_id: ^^create_package_version.subscriber_package_version_id
          install_key: ^^create_package_version.install_key

  release_unlocked_beta:
    steps:
      0.5:
        task: update_dependencies
        options:
          dependencies:
            - namespace: litify_pm
              version: "35.0"
          packages_only: True
      1:
        task: create_package_version
        options:
          package_type: Unlocked
          package_name: $project_config.project__package__name
          skip_validation: False
          version_base: latest_github_release
          version_type: minor
          force_upload: True
          create_unlocked_dependency_packages: False
      2:
        task: github_release
        options:
          version: ^^create_package_version.version_number
          version_id: ^^create_package_version.subscriber_package_version_id
          dependencies: ^^create_package_version.dependencies
          package_type: 2GP
          tag_prefix: $project_config.project__git__prefix_beta
      3:
        task: github_release_notes
        options:
          link_pr: True
          publish: True
          tag: ^^github_release.tag_name
          include_empty: True
          version_id: ^^create_package_version.subscriber_package_version_id
      4:
        task: github_automerge_main
